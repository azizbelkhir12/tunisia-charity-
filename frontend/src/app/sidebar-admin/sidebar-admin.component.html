<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <img src="assets/logo2.png" alt="Tunisia Charity" class="sidebar-logo" />

      <div class="sidebar-brand">
        <div class="sidebar-title">Tunisia Charity</div>
        <div class="sidebar-subtitle">Espace Admin</div>
      </div>
    </div>

    <nav class="sidebar-navigation">
      <a
        *ngFor="let item of navigationItems"
        [routerLink]="item.to"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact === true }"
        class="navigation-link"
      >
        <i-lucide [name]="item.icon" class="navigation-icon"></i-lucide>

        <span>{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button
        type="button"
        class="navigation-link return-link logout-button"
        (click)="logout()"
      >
        <i-lucide name="log-out" class="navigation-icon"></i-lucide>
        <span>Retour au site</span>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="admin-main">
    <header class="admin-topbar">
      <div class="admin-topbar-search">
        <i-lucide name="search" class="admin-topbar-search-icon"></i-lucide>

        <input
          type="search"
          class="admin-topbar-search-input"
          placeholder="Rechercher..."
          aria-label="Rechercher"
        />
      </div>

      <div class="admin-topbar-actions">
        <button
          type="button"
          class="admin-notification-button"
          aria-label="Notifications"
        >
          <i-lucide name="bell" class="admin-notification-icon"></i-lucide>

          <span class="admin-notification-dot"></span>
        </button>

        <div class="admin-user-profile">
          <div class="admin-user-avatar">A</div>

          <div class="admin-user-details">
            <span class="admin-user-name">Admin</span>

            <span class="admin-user-email"> admin&#64;tunisiacharity.org </span>
          </div>
        </div>
      </div>
    </header>
    <main class="admin-content">
      <ng-content></ng-content>
    </main>
  </div>
</div>
